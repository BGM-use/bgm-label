<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BGMTECH Equipment Label</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #fff;
            padding: 20px;
            font-family: Arial, Helvetica, sans-serif;
        }
        .label-card {
            max-width: 900px;
            margin: 0 auto;
            border: 3px solid #222;
            padding: 24px;
        }
        .header-wrap {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 12px;
        }
        .logo-box {
            background: #000;
            color: #fff;
            font-size: 80px;
            font-weight: bold;
            line-height: 1;
            padding: 8px 14px;
        }
        .tech-text {
            font-size: 80px;
            font-weight: bold;
        }
        .ce-text {
            font-size: 90px;
            font-weight: bold;
            margin-left: auto;
        }
        .tm-line {
            font-size: 28px;
            margin-bottom: 30px;
            padding-left: 10px;
        }
        .grid-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            font-size: 42px;
            line-height: 1.4;
            margin-bottom: 8px;
        }
        .bottom-line {
            font-size: 42px;
            line-height: 1.45;
            margin-top:20px;
        }
        .web-link{
            font-size: 44px;
            text-align:center;
            margin-top:16px;
        }
        .web-link a{
            color:#000;
            text-decoration:none;
        }
        /* 管理面板，默认隐藏 */
        .sn-input-area{
            max-width:900px;
            margin:20px auto 0;
            padding:16px;
            border:1px solid #ccc;
            border-radius:8px;
            display: none;
        }
        .sn-input-area input{
            padding:8px;
            font-size:20px;
            width:70%;
            margin:4px 0;
        }
        .sn-input-area button{
            padding:8px 16px;
            font-size:20px;
            cursor:pointer;
            margin:4px;
        }
        .tip-text{
            color:#239b23;
            margin-top:8px;
            display:none;
        }
        #outBox{
            width:100%;
            min-height:120px;
            margin-top:10px;
            padding:8px;
            font-size:14px;
        }
        @media(max-width:768px){
            .header-wrap{flex-wrap:wrap;}
            .logo-box,.tech-text,.ce-text{font-size:48px;}
            .tm-line{font-size:20px;}
            .grid-row{font-size:26px;grid-template-columns:1fr;}
            .bottom-line{font-size:26px;}
            .web-link{font-size:28px;}
            .sn-input-area input{width:60%;}
        }
    </style>
</head>
<body>
    <div class="label-card">
        <div class="header-wrap">
            <div class="logo-box">BGM</div>
            <div class="tech-text">TECH</div>
            <div class="ce-text">CE</div>
        </div>
        <div class="tm-line">TRADE MARK`S [H/BD/01/257083]</div>

        <div class="grid-row">
            <div>BRAND:BGMTECH</div>
            <div>DATE:<span id="date-text">26/10/25</span></div>
        </div>
        <div class="grid-row">
            <div>MODEL:<span id="model-text">A1425</span></div>
            <div>S/N:<span id="sn-text"></span></div>
        </div>
        <div class="grid-row">
            <div>POWER:7.5KW</div>
            <div>ORIGINAL:CHINA</div>
        </div>

        <div class="bottom-line">
            IMPORTER:BGM TECH INTERNATIONAL CNC COMPANY LTD<br>
            Tel:+8801711063246,+8801851-552800
        </div>
        <div class="web-link">
            <a href="https://www.bgmtechcnc.com" target="_blank">http://www.bgmtechcnc.com</a>
        </div>
    </div>

    <!-- 管理面板：仅 ?admin=1 时显示 -->
    <div class="sn-input-area" id="admin-panel">
        <div>序列号S/N：<input type="text" id="sn-input" placeholder="输入序列号"></div>
        <div>型号MODEL：<input type="text" id="model-input" placeholder="输入型号"></div>
        <div>日期DATE：<input type="text" id="date-input" placeholder="输入日期 如26/10/25"></div>
        <div>生成数量：<input type="number" id="count-input" value="15" min="1"></div>

        <button onclick="fillPreview()">预览单条</button>
        <button onclick="batchGenerate()">批量生成链接</button>
        <button onclick="copyAll()">复制全部链接</button>

        <div style="margin-top:10px;word-break:break-all;">
            单条链接预览：<br>
            <span id="link-preview"></span>
        </div>
        <textarea id="outBox" readonly placeholder="批量生成的链接会出现在这里"></textarea>
        <div class="tip-text" id="copy-tip">✅ 链接已复制！</div>
    </div>

<script>
function getUrlParam(name) {
    const params = new URLSearchParams(window.location.search);
    return params.get(name) || "";
}

//页面加载读取参数
window.onload = function(){
    const sn = getUrlParam('sn');
    const model = getUrlParam('model');
    const date = getUrlParam('date');
    const admin = getUrlParam('admin');

    if(sn) document.getElementById('sn-text').innerText = sn;
    if(model) document.getElementById('model-text').innerText = model;
    if(date) document.getElementById('date-text').innerText = date;

    //管理面板赋值
    document.getElementById('sn-input').value = sn;
    document.getElementById('model-input').value = model;
    document.getElementById('date-input').value = date;

    if(admin === "1"){
        document.getElementById('admin-panel').style.display = "block";
    }
    fillPreview();
}

//预览单条链接
function fillPreview(){
    const snVal = document.getElementById('sn-input').value.trim();
    const modVal = document.getElementById('model-input').value.trim();
    const datVal = document.getElementById('date-input').value.trim();
    document.getElementById('sn-text').innerText = snVal;
    document.getElementById('model-text').innerText = modVal;
    document.getElementById('date-text').innerText = datVal;

    const baseUrl = window.location.origin + window.location.pathname;
    const oneLink = `${baseUrl}?sn=${snVal}&model=${modVal}&date=${datVal}`;
    document.getElementById('link-preview').innerText = oneLink;
}

//序列号自动递增批量生成
function batchGenerate(){
    const baseUrl = window.location.origin + window.location.pathname;
    let startSn = document.getElementById('sn-input').value.trim();
    const modVal = document.getElementById('model-input').value.trim();
    const datVal = document.getElementById('date-input').value.trim();
    const total = parseInt(document.getElementById('count-input').value);

    const numReg = /(\d+)$/;
    const match = startSn.match(numReg);
    let prefix = startSn;
    let num = 0;
    let digitLen = 4;
    if(match){
        num = parseInt(match[1]);
        digitLen = match[1].length;
        prefix = startSn.replace(numReg,'');
    }

    let output = "";
    for(let i=0;i<total;i++){
        const nowNum = String(num+i).padStart(digitLen,'0');
        const currSn = prefix + nowNum;
        output += `${baseUrl}?sn=${currSn}&model=${modVal}&date=${datVal}` + "\n";
    }
    document.getElementById('outBox').value = output;
}

async function copyAll(){
    const content = document.getElementById('outBox').value;
    if(!content) return;
    try{
        await navigator.clipboard.writeText(content);
        document.getElementById('copy-tip').style.display="block";
        setTimeout(()=>document.getElementById('copy-tip').style.display="none",1500);
    }catch(e){
        alert("复制失败，请手动复制文本框内内容");
    }
}
</script>
</body>
</html>
