<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BGMTECH Label</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #fff;
            padding: 16px;
            font-family: Arial, Helvetica, sans-serif;
            line-height: 1.45;
        }
        .label-wrap {
            border: 2px solid #000;
            padding: 20px;
            max-width: 520px;
            margin: 0 auto;
        }
        .logo-block {
            display: inline-block;
            background: #000;
            color: #fff;
            font-size: clamp(42px,12vw,72px);
            font-weight: bold;
            padding: 4px 12px;
        }
        .title-row {
            display: flex;
            align-items: baseline;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        .tech-text {
            font-size: clamp(42px,12vw,72px);
            font-weight: bold;
        }
        .ce-text {
            font-size: clamp(42px,12vw,72px);
            font-weight: bold;
        }
        .small-text {
            font-size: clamp(16px,4vw,22px);
            margin-bottom:18px;
        }
        .line-item {
            font-size: clamp(22px,6vw,34px);
            margin: 6px 0;
            font-weight:500;
        }
        .url-line {
            margin-top:16px;
            font-size: clamp(18px,4.5vw,26px);
            color:#000;
            word-break: break-all;
        }
        /* 管理面板 */
        .admin-panel {
            margin-top: 30px;
            padding:16px;
            border:1px solid #999;
            background:#f8f8f8;
            max-width:520px;
            margin-left:auto;
            margin-right:auto;
        }
        .admin-panel input {
            width:100%;
            padding:8px;
            margin:6px 0;
            font-size:16px;
        }
        .admin-panel button {
            padding:8px 16px;
            cursor:pointer;
        }
    </style>
</head>
<body>
    <div class="label-wrap">
        <div class="title-row">
            <div class="logo-block">BGM</div>
            <div class="tech-text">TECH</div>
            <div class="ce-text">CE</div>
        </div>
        <div class="small-text">
            TRADE MARK`S<br>
            <span id="tm-no">[H/BD/01/257083]</span>
        </div>

        <div class="line-item">BRAND:<span id="brand">BGMTECH</span></div>
        <div class="line-item">DATE:<span id="date">26/10/25</span></div>
        <div class="line-item">MODEL:<span id="model">A1425</span></div>
        <div class="line-item">S/N:<span id="sn">2610251136</span></div>
        <div class="line-item">POWER:<span id="power">7.5KW</span></div>
        <div class="line-item">ORIGINAL:<span id="origin">CHINA</span></div>

        <div class="line-item">IMPORTER:<span id="importer">BGM TECH</span></div>
        <div class="line-item">INTERNATIONAL</div>
        <div class="line-item">CNC COMPANY</div>
        <div class="line-item">LTD</div>

        <div class="line-item">Tel:<span id="tel">+8801711063246,+8801851-552800</span></div>

        <div class="url-line" id="web">http://www.bgmtechcnc.com</div>
    </div>

    <div class="admin-panel" id="adminBox" style="display:none">
        <h3>EDIT LABEL</h3>
        <input type="text" id="inpTm" placeholder="TRADE MARK NO">
        <input type="text" id="inpBrand" placeholder="BRAND">
        <input type="text" id="inpDate" placeholder="DATE">
        <input type="text" id="inpModel" placeholder="MODEL">
        <input type="text" id="inpSN" placeholder="S/N">
        <input type="text" id="inpPower" placeholder="POWER">
        <input type="text" id="inpOrigin" placeholder="ORIGINAL">
        <input type="text" id="inpImporter" placeholder="IMPORTER">
        <input type="text" id="inpTel" placeholder="TEL">
        <input type="text" id="inpWeb" placeholder="WEBSITE">
        <button onclick="saveData()">Save & Generate Link</button>
        <div id="linkOut"></div>
    </div>

    <script>
        const url = new URL(location.href);
        const admin = url.searchParams.get('admin');
        if(admin==='1'){
            document.getElementById('adminBox').style.display='block';
        }
        function load(){
            document.getElementById('tm-no').innerText = url.searchParams.get('tm')||'[H/BD/01/257083]';
            document.getElementById('brand').innerText = url.searchParams.get('brand')||'BGMTECH';
            document.getElementById('date').innerText = url.searchParams.get('date')||'';
            document.getElementById('model').innerText = url.searchParams.get('model')||'';
            document.getElementById('sn').innerText = url.searchParams.get('sn')||'';
            document.getElementById('power').innerText = url.searchParams.get('power')||'';
            document.getElementById('origin').innerText = url.searchParams.get('origin')||'CHINA';
            document.getElementById('importer').innerText = url.searchParams.get('importer')||'BGM TECH';
            document.getElementById('tel').innerText = url.searchParams.get('tel')||'';
            document.getElementById('web').innerText = url.searchParams.get('web')||'http://www.bgmtechcnc.com';

            document.getElementById('inpTm').value = url.searchParams.get('tm')||'[H/BD/01/257083]';
            document.getElementById('inpBrand').value = url.searchParams.get('brand')||'BGMTECH';
            document.getElementById('inpDate').value = url.searchParams.get('date')||'';
            document.getElementById('inpModel').value = url.searchParams.get('model')||'';
            document.getElementById('inpSN').value = url.searchParams.get('sn')||'';
            document.getElementById('inpPower').value = url.searchParams.get('power')||'';
            document.getElementById('inpOrigin').value = url.searchParams.get('origin')||'CHINA';
            document.getElementById('inpImporter').value = url.searchParams.get('importer')||'BGM TECH';
            document.getElementById('inpTel').value = url.searchParams.get('tel')||'';
            document.getElementById('inpWeb').value = url.searchParams.get('web')||'http://www.bgmtechcnc.com';
        }
        function saveData(){
            const tm = document.getElementById('inpTm').value;
            const brand = document.getElementById('inpBrand').value;
            const d = document.getElementById('inpDate').value;
            const m = document.getElementById('inpModel').value;
            const sn = document.getElementById('inpSN').value;
            const p = document.getElementById('inpPower').value;
            const ori = document.getElementById('inpOrigin').value;
            const imp = document.getElementById('inpImporter').value;
            const tel = document.getElementById('inpTel').value;
            const web = document.getElementById('inpWeb').value;
            const base = location.origin + location.pathname;
            const link = `${base}?tm=${encodeURIComponent(tm)}&brand=${encodeURIComponent(brand)}&date=${encodeURIComponent(d)}&model=${encodeURIComponent(m)}&sn=${encodeURIComponent(sn)}&power=${encodeURIComponent(p)}&origin=${encodeURIComponent(ori)}&importer=${encodeURIComponent(imp)}&tel=${encodeURIComponent(tel)}&web=${encodeURIComponent(web)}`;
            document.getElementById('linkOut').innerText = link;
        }
        load();
    </script>
</body>
</html>
