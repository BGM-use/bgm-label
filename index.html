<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>BGMTECH Equipment Label</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background: #fff;
    padding: 12px;
    font-family: "Arial", "Helvetica", sans-serif;
    color: #000;
  }

  .label-card {
    max-width: 620px;
    margin: 0 auto;
    border: 3px solid #000;
    padding: 14px;
    background: #fff;
  }

  .brand-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 6px;
  }

  .logo-main {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-box {
    background: #000;
    color: #fff;
    font-size: clamp(28px, 7vw, 48px);
    font-weight: 900;
    letter-spacing: 1px;
    padding: 4px 12px;
    line-height: 1;
    border: 2px solid #000;
  }

  .tech-text {
    font-size: clamp(22px, 5.4vw, 38px);
    font-weight: 900;
    letter-spacing: 1px;
  }

  .ce-box {
    font-size: clamp(28px, 7vw, 48px);
    font-weight: 900;
    letter-spacing: 2px;
  }

  .tm-row {
    font-size: clamp(13px, 3vw, 16px);
    text-align: right;
    margin-bottom: 10px;
    padding-right: 4px;
  }

  .tm-row span {
    font-weight: 700;
  }

  .info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 14px;
    margin-bottom: 12px;
  }

  .info-item {
    font-size: clamp(14px, 3.4vw, 18px);
    font-weight: 700;
    white-space: nowrap;
  }

  .info-item .value {
    font-weight: 500;
  }

  .bottom-section {
    border-top: 2px solid #000;
    padding-top: 10px;
    font-size: clamp(13px, 3.2vw, 17px);
    line-height: 1.5;
  }

  .importer-label {
    font-weight: 700;
    margin-bottom: 2px;
  }

  .importer-name {
    font-weight: 700;
    margin-bottom: 6px;
    white-space: normal;
  }

  .contact-row {
    font-weight: 700;
    margin-bottom: 4px;
  }

  .web-link {
    font-weight: 700;
    word-break: break-all;
  }

  .admin-panel {
    max-width: 620px;
    margin: 20px auto 0;
    padding: 14px;
    border: 1px dashed #999;
    background: #f7f7f7;
    display: none;
  }

  .admin-panel h3 {
    margin-bottom: 8px;
    font-size: 16px;
  }

  .admin-panel input {
    width: 100%;
    padding: 7px;
    margin: 4px 0;
    font-size: 14px;
    border: 1px solid #999;
    border-radius: 4px;
  }

  .admin-panel button {
    margin-top: 6px;
    padding: 8px 14px;
    cursor: pointer;
    background: #000;
    color: #fff;
    border: none;
    border-radius: 4px;
  }

  .link-output {
    margin-top: 8px;
    word-break: break-all;
    font-size: 13px;
    background: #fff;
    padding: 7px;
    border: 1px solid #ccc;
    min-height: 60px;
    white-space: pre-wrap;
  }

  @media (max-width: 480px) {
    body {
      padding: 6px;
    }

    .label-card {
      padding: 10px;
      border-width: 2px;
    }

    .info-grid {
      gap: 6px 10px;
    }
  }
</style>
</head>

<body>

<div class="label-card">
  <div class="brand-header">
    <div class="logo-main">
      <div class="logo-box">BGM</div>
      <div class="tech-text">TECH</div>
    </div>
    <div class="ce-box">CE</div>
  </div>

  <div class="tm-row">
    TRADE MARK NO: <span>[H/BD/01/257083]</span>
  </div>

  <div class="info-grid">
    <div class="info-item">BRAND:<span class="value">BGMTECH</span></div>
    <div class="info-item">DATE:<span class="value" id="date-text"></span></div>
    <div class="info-item">MODEL:<span class="value" id="model-text"></span></div>
    <div class="info-item">S / N:<span class="value" id="sn-text"></span></div>
    <div class="info-item">POWER:<span class="value">7.5KW</span></div>
    <div class="info-item">ORIGINAL:<span class="value">CHINA</span></div>
  </div>

  <div class="bottom-section">
    <div class="importer-label">IMPORTER:</div>
    <div class="importer-name">BGM TECH INTERNATIONAL CNC COMPANY LTD</div>
    <div class="contact-row">Tel:+8801711063246,+8801851-552800</div>
    <div class="web-link">http://www.bgmtechcnc.com</div>
  </div>
</div>

<!-- 管理面板：仅 ?admin=1 显示 -->
<div class="admin-panel" id="adminPanel">
  <h3>⚙️ 管理编辑面板（仅管理员可见）</h3>
  <div>
    <label>MODEL 型号：</label>
    <input type="text" id="inpModel" placeholder="例如 A1425">
  </div>
  <div>
    <label>DATE 日期：</label>
    <input type="text" id="inpDate" placeholder="例如 26/10/25">
  </div>
  <div>
    <label>S / N 序列号（起始号）：</label>
    <input type="text" id="inpSN" placeholder="例如 2610251136">
  </div>
  <div>
    <label>批量生成数量：</label>
    <input type="number" id="inpCount" value="15" min="1">
  </div>

  <button onclick="generateSingle()">生成单条链接</button>
  <button onclick="generateBatch()">批量自动递增生成</button>
  <button onclick="copyAll()">📋 一键复制全部链接</button>

  <div class="link-output" id="linkOut"></div>
</div>

<script>
  const url = new URL(location.href);
  const params = url.searchParams;
  const isAdmin = params.get('admin') === '1';

  const model = params.get('model') || '';
  const date  = params.get('date')  || '';
  const sn    = params.get('sn')    || '';

  document.getElementById('model-text').innerText = model;
  document.getElementById('date-text').innerText  = date;
  document.getElementById('sn-text').innerText    = sn;

  if (isAdmin) {
    document.getElementById('adminPanel').style.display = 'block';
    document.getElementById('inpModel').value = model;
    document.getElementById('inpDate').value  = date;
    document.getElementById('inpSN').value     = sn;
  }

  const baseUrl = location.origin + location.pathname;

  // 单条
  function generateSingle() {
    const m = document.getElementById('inpModel').value.trim();
    const d = document.getElementById('inpDate').value.trim();
    const s = document.getElementById('inpSN').value.trim();
    const link = `${baseUrl}?model=${encodeURIComponent(m)}&date=${encodeURIComponent(d)}&sn=${encodeURIComponent(s)}`;
    document.getElementById('linkOut').innerText = link;

    document.getElementById('model-text').innerText = m;
    document.getElementById('date-text').innerText  = d;
    document.getElementById('sn-text').innerText    = s;
  }

  // 批量自动递增
  function generateBatch() {
    const m = document.getElementById('inpModel').value.trim();
    const d = document.getElementById('inpDate').value.trim();
    let startSn = document.getElementById('inpSN').value.trim();
    const total = parseInt(document.getElementById('inpCount').value) || 1;

    const numReg = /(\d+)$/;
    const match = startSn.match(numReg);
    let prefix = startSn;
    let num = 0;
    let digitLen = 4;
    if (match) {
      num = parseInt(match[1]);
      digitLen = match[1].length;
      prefix = startSn.replace(numReg, '');
    }

    let out = '';
    for (let i = 0; i < total; i++) {
      const nowNum = String(num + i).padStart(digitLen, '0');
      const currSn = prefix + nowNum;
      out += `${baseUrl}?model=${encodeURIComponent(m)}&date=${encodeURIComponent(d)}&sn=${encodeURIComponent(currSn)}\n`;
    }
    document.getElementById('linkOut').innerText = out;
  }

  // 一键复制全部
  async function copyAll() {
    const content = document.getElementById('linkOut').innerText;
    if (!content.trim()) {
      alert('请先生成链接');
      return;
    }
    try {
      await navigator.clipboard.writeText(content);
      alert('✅ 已复制全部链接到剪贴板');
    } catch (e) {
      // 兼容旧浏览器
      const ta = document.getElementById('linkOut');
      ta.select();
      document.execCommand('copy');
      alert('✅ 已复制');
    }
  }
</script>

</body>
</html>
